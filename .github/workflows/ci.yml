name: CI

# Release policy: a `v*` tag runs this workflow on the exact commit it names.
# A GitHub Release is published from a tag only after that run is green, so the
# released commit, not a similar one, was built and tested.
#
# Cost: nothing is run twice. A pull request that only touches documentation skips
# the build jobs, a draft skips them until it is marked ready, and a ready pull
# request runs Linux with Swift 6.4 and libvips 8.18. The merge to main then runs
# what the pull request did not: Linux with the Swift 6.0 baseline and macOS. A tag
# and a manual run build the whole matrix. The single required check is `CI
# complete`, which passes when nothing it waits on failed; a skipped job counts as
# passing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - release/2.0
  push:
    branches:
      - main
    tags:
      - "v*"
  # Re-run a tag whose runner never came: gh workflow run ci.yml --ref v2.0.1
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Support matrix (#49): the baseline job proves the minimum contract
# (Swift 6.0, libvips 8.16, Cairo 1.16); the current jobs cover Swift 6.4 and
# current native libraries on Linux and macOS.
jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Documentation-only means every changed path is Markdown, a licence, an
      # issue template or an image under docs/. Workflow, script and package
      # changes always count as code. Anything that is not a pull request builds.
      # Which Linux legs run: a pull request gets the current toolchain, the merge to main gets
      # the Swift 6.0 baseline that the pull request did not run (with macOS), and a tag or a
      # manual run gets both.
      - id: filter
        run: |
          baseline='{"name":"baseline","swift":"6.0","distro":"jammy","vips":"8.16.1","expect":"text,pdfInput,pdfOutput,svgInput,tiff","extra-packages":""}'
          current='{"name":"current","swift":"6.4","distro":"noble","vips":"8.18.7","expect":"text,pdfInput,pdfOutput,svgInput,avif,heif,gif,tiff,palette","extra-packages":"libjxl-dev libhwy-dev libimagequant-dev libcgif-dev libheif-plugin-aomenc libheif-plugin-dav1d"}'
          case "${{ github.event_name }}:${{ github.ref }}" in
            pull_request:*) echo "linux=[$current]" >> "$GITHUB_OUTPUT" ;;
            push:refs/tags/*|workflow_dispatch:*) echo "linux=[$baseline,$current]" >> "$GITHUB_OUTPUT" ;;
            *) echo "linux=[$baseline]" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -vE '(^|/)[^/]+\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE|^docs/' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    name: Linux ${{ matrix.name }} (Swift ${{ matrix.swift }}, libvips ${{ matrix.vips }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-${{ matrix.distro }}
    strategy:
      fail-fast: false
      # The legs to run, with their settings, are built by the `changes` job. (An `include` list
      # next to a name filter would add the legs that did not match as extra jobs.)
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    env:
      VIPS_PREFIX: /opt/vips
      PKG_CONFIG_PATH: /opt/vips/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/vips/lib
      EXPECTED_SWIFT: ${{ matrix.swift }}
      # Capabilities this job's native install must provide; the test fails
      # instead of skipping when one is missing.
      HOKUSAI_EXPECT_CAPABILITIES: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates xz-utils zstd meson ninja-build pkg-config build-essential \
            libglib2.0-dev libexpat1-dev libjpeg-dev libpng-dev libwebp-dev \
            libtiff-dev libgif-dev libexif-dev liblcms2-dev libcairo2-dev \
            libpango1.0-dev librsvg2-dev libpoppler-glib-dev libheif-dev \
            libarchive-dev libfftw3-dev liborc-0.4-dev fonts-dejavu-core \
            ${{ matrix.extra-packages }}

      - name: Restore libvips build
        uses: actions/cache@v4
        with:
          path: /opt/vips
          key: vips-${{ matrix.vips }}-${{ matrix.distro }}-${{ hashFiles('.github/scripts/install-libvips.sh') }}

      - name: Install libvips ${{ matrix.vips }}
        run: .github/scripts/install-libvips.sh "${{ matrix.vips }}" "$VIPS_PREFIX"

      # Dependencies (swift-nio, ArgumentParser, ...) are most of a cold build and change only
      # with Package.swift, so their build products are kept between runs. The key has no
      # source hash on purpose: an exact hit restores them and the current sources are
      # rebuilt on top; the first run of a new key saves them.
      - name: Restore SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-swift${{ matrix.swift }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-linux-swift${{ matrix.swift }}-

      - name: Report native versions
        run: PATH="$VIPS_PREFIX/bin:$PATH" .github/scripts/report-native.sh

      - name: Build (library + CLI + tests)
        run: swift build --build-tests

      - name: Build optional integration products
        run: |
          swift build --target HokusaiNIO

      - name: Test
        run: swift test

      - name: Test with untrusted loaders blocked
        run: VIPS_BLOCK_UNTRUSTED=1 swift test --filter blockedFormatsAreReportedSeparatelyFromAbsentOnes

      - name: Build CLI (release)
        run: swift build -c release --product hokusai

      - name: CLI smoke test
        run: .github/scripts/cli-smoke.sh

  macos:
    needs: changes
    # macOS is the dearest runner and its setup is half of its time, so it runs where a regression
    # must not slip through unseen (after a merge to main, on a tag, on a manual run) and not on
    # every push to a pull request, which gets the two Linux jobs.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name != 'pull_request'
    name: macOS current (Swift 6.4, Homebrew libvips)
    runs-on: macos-26
    env:
      EXPECTED_SWIFT: "6.4"
      HOKUSAI_EXPECT_CAPABILITIES: "text,pdfInput,pdfOutput,svgInput,avif,heif,gif,tiff"
    steps:
      - uses: actions/checkout@v4

      # The SwiftPM build products are kept between runs (see the Linux job).
      - name: Restore SwiftPM build products
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-swift6.4-${{ hashFiles('Package.swift') }}
          restore-keys: spm-macos-swift6.4-

      # Runner Xcode releases lag swift.org; install the 6.4 toolchain directly.
      - name: Install Swift 6.4
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes 6.4
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install libvips and Cairo PDF support
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew install vips cairo pkg-config

      - name: Report native versions
        run: .github/scripts/report-native.sh

      - name: Build (library + CLI + tests)
        run: swift build --build-tests

      - name: Build optional integration products
        run: |
          swift build --target HokusaiNIO

      - name: Test
        run: swift test

      - name: Test with untrusted loaders blocked
        run: VIPS_BLOCK_UNTRUSTED=1 swift test --filter blockedFormatsAreReportedSeparatelyFromAbsentOnes

      - name: Build CLI (release)
        run: swift build -c release --product hokusai

      - name: CLI smoke test
        run: .github/scripts/cli-smoke.sh

  # Cheap checks on a pull request: seconds on a plain runner, no Swift toolchain, and part of
  # the required `CI complete` through its needs. They also run on a draft, since a
  # broken workflow or a missing changelog entry is cheaper to hear about early.
  checks:
    name: Workflow lint and changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Catches workflow mistakes (bad expressions, unknown inputs, shell errors) before they
      # break a run. Two things are ignored on purpose: SC1090 (the `source` of the Swift
      # toolchain's environment file, which cannot be followed statically) and the pinned
      # version's list of runner labels, which predates `macos-26`.
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -ignore 'SC1090' -ignore 'label "macos-26" is unknown'

      # A change to the library's sources is a change users can see, so it needs a changelog
      # entry. A pull request that has none for a good reason carries the `no-changelog` label.
      - name: Require a changelog entry for source changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if ! echo "$changed" | grep -q '^Sources/'; then echo "No source changes."; exit 0; fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then echo "CHANGELOG.md is updated."; exit 0; fi
          if echo ",$LABELS," | grep -q ',no-changelog,'; then echo "Skipped by the no-changelog label."; exit 0; fi
          echo "::error::Sources changed but CHANGELOG.md did not. Add an entry under [Unreleased], or add the no-changelog label."
          exit 1

  # The one required check. Matrix jobs that are skipped report under an
  # unexpanded name, so they cannot be required themselves.
  complete:
    name: CI complete
    if: always()
    needs: [changes, linux, macos, checks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} linux=${{ needs.linux.result }} macos=${{ needs.macos.result }} checks=${{ needs.checks.result }}"
          # Only success and skipped pass. A job can also end "abandoned" when no
          # runner picks it up, which must not count as green.
          for result in "${{ needs.changes.result }}" "${{ needs.linux.result }}" "${{ needs.macos.result }}" "${{ needs.checks.result }}"; do
            case "$result" in success|skipped) ;; *) echo "not green: $result"; exit 1 ;; esac
          done
